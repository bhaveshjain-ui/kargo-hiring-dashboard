name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The build and tests below never hit a real database or Gemini —
      # these are dummy values only so code that reads process.env at
      # import/build time doesn't crash; see src/lib/parseCv.ts comments on
      # why the production server also needs to actually boot and be hit
      # with a real request (the smoke test step), not just type-check.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DASHBOARD_PASSWORD: "ci-test-password"
      GEMINI_API_KEYS: "ci-dummy-key"
      RESEND_API_KEY: "ci-dummy-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test (real production server, real PDF upload)
        run: npm run test:smoke
